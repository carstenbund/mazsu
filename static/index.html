<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symbolic Field Generator</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Ensure basic layout works even without your CSS file */
  body { font-family: sans-serif; padding: 20px; }
  #toggleConfig { margin-bottom: 1em; }

  /* Collapsible container */
  #configContainer {
    transition: max-height 0.4s ease, opacity 0.3s ease;
    overflow: hidden;
    max-height: 1200px;
    opacity: 1;
  }
  #configContainer.collapsed {
    max-height: 0;
    opacity: 0;
    pointer-events: none;
  }

  #controls {
    background: #fafafa;
    border: 1px solid #ccc;
    padding: 1em;
    border-radius: 8px;
  }

  .section { margin-bottom: 1em; }
  .flex-row { display: flex; flex-wrap: wrap; gap: 1em; }
  .field { display: flex; flex-direction: column; }
  .action-buttons { margin-top: 1em; display: flex; gap: 0.5em; }
</style>
</head>
<body>
  
<h1>Symbolic Field Generator</h1>

<button id="toggleConfig">⚙️ Show/Hide Config</button>

<div id="configContainer" class="collapsed">
  <form id="configForm">
    <div id="controls">

      <!-- GLOBAL -->
      <div class="section">
        <h2>Global Settings</h2>
        <div class="flex-row wrap">
          <div class="field"><label>Grid Size</label><input type="number" id="grid_size" value="10"></div>
          <div class="field"><label>Width</label><input type="number" id="width" value="800"></div>
          <div class="field"><label>Height</label><input type="number" id="height" value="800"></div>
          <div class="field checkbox-field">
            <label><input type="checkbox" id="use_fixed_seed"> Use fixed seed</label>
          </div>
          <div class="field">
            <label>Seed</label><input type="number" id="seed_value" step="1">
          </div>
        </div>
      </div>

      <!-- GRID HEATMAP -->
      <div class="section">
        <h2>Heatmaps – Grid</h2>
        <div class="flex-row wrap">
          <div class="field heatmap-field">
            <label for="grid_file_select">File</label>
            <div class="heatmap-source-row">
              <select id="grid_file_select" aria-label="Choose an existing grid map"></select>
              <input type="text" id="grid_file" placeholder="maps/grid_density.png">
            </div>
            <div class="heatmap-action-row">
              <input type="file" id="grid_file_upload" accept="image/*">
              <button type="button" class="heatmap-upload" data-target="grid">Upload</button>
              <button type="button" class="preview-heatmap" data-target="grid_file">Preview</button>
            </div>
            <label class="check"><input type="checkbox" id="grid_use_perlin"> Use Perlin</label>
          </div>
          <div class="field">
            <label>Mode</label>
            <select id="grid_mode">
              <option>replace</option><option>add</option><option>multiply</option>
            </select>
            <label>Perlin Scale</label><input type="number" id="grid_scale" step="0.01">
          </div>
          <div class="field">
            <label>Perlin Octaves</label><input type="number" id="grid_octaves">
          </div>
        </div>
      </div>

      <!-- GRID APPEARANCE -->
      <div class="section">
        <h2>Grid Appearance</h2>
        <div class="flex-row wrap">
          <div class="field">
            <label>Dot Radius</label>
            <input type="number" id="grid_dot_radius" step="0.1" min="0">
          </div>
          <div class="field">
            <label>Dot Opacity</label>
            <input type="number" id="grid_dot_opacity" step="0.05" min="0" max="1">
          </div>
          <div class="field">
            <label>Dot Color</label>
            <input type="text" id="grid_dot_color">
          </div>
        </div>
        <div class="flex-row wrap">
          <div class="field">
            <label>Line Stroke Width</label>
            <input type="number" id="grid_line_width" step="0.1" min="0">
          </div>
          <div class="field">
            <label>Line Color</label>
            <input type="text" id="grid_line_color">
          </div>
          <div class="field">
            <label>Line Opacity</label>
            <input type="number" id="grid_line_opacity" step="0.05" min="0" max="1">
          </div>
        </div>
        <div class="flex-row wrap">
          <div class="field">
            <label>Line Center Probability</label>
            <input type="number" id="grid_line_center_probability" step="0.05" min="0" max="1">
          </div>
          <div class="field">
            <label>Line Edge Probability</label>
            <input type="number" id="grid_line_edge_probability" step="0.05" min="0" max="1">
          </div>
          <div class="field">
            <label>Diagonal Bias</label>
            <input type="number" id="grid_line_diagonal_bias" step="0.05" min="0">
          </div>
          <div class="field">
            <label>Max Connections</label>
            <input type="number" id="grid_line_max_connections" min="0" step="1">
          </div>
        </div>
      </div>

      <!-- FIGURE HEATMAP -->
      <div class="section">
        <h2>Heatmaps – Figure</h2>
        <div class="flex-row wrap">
          <div class="field heatmap-field">
            <label for="figure_file_select">File</label>
            <div class="heatmap-source-row">
              <select id="figure_file_select" aria-label="Choose an existing figure map"></select>
              <input type="text" id="figure_file" placeholder="maps/figure_density.png">
            </div>
            <div class="heatmap-action-row">
              <input type="file" id="figure_file_upload" accept="image/*">
              <button type="button" class="heatmap-upload" data-target="figure">Upload</button>
              <button type="button" class="preview-heatmap" data-target="figure_file">Preview</button>
            </div>
            <label class="check"><input type="checkbox" id="figure_use_perlin"> Use Perlin</label>
          </div>
          <div class="field">
            <label>Mode</label>
            <select id="figure_mode">
              <option>replace</option><option>add</option><option>multiply</option>
            </select>
            <label>Perlin Scale</label><input type="number" id="figure_scale" step="0.01">
          </div>
          <div class="field">
            <label>Perlin Octaves</label><input type="number" id="figure_octaves">
            <label>Palettes</label>
            <div class="palette-controls">
              <div id="paletteList" class="palette-list" aria-live="polite"></div>
              <button type="button" id="addPaletteColor" class="palette-add">Add Color</button>
            </div>
          </div>
        </div>
      </div>

      <!-- FIGURES -->
      <div class="section">
        <h2>Figures</h2>
        <div class="flex-row wrap">
          <div class="field">
            <label>Scale Factor</label>
            <input type="number" id="figure_scale_factor" step="0.01" value="0.08">
          </div>
          <div class="field">
            <label>Target Count</label>
            <input type="number" id="figure_amount" min="0" step="1">
          </div>
          <div class="field">
            <label>Transparency</label>
            <input type="number" id="figure_transparency" step="0.05" min="0" max="1">
          </div>
        </div>
        <div class="flex-row wrap">
          <div class="field">
            <label>Line Thickness</label>
            <input type="number" id="figure_line_thickness" step="0.1" min="0">
          </div>
          <div class="field">
            <label>Line Color</label>
            <input type="text" id="figure_line_color">
          </div>
          <div class="field">
            <label>Line Opacity</label>
            <input type="number" id="figure_line_opacity" step="0.05" min="0" max="1">
          </div>
        </div>
      </div>


    </div>
  </form>
</div>
<div class="action-buttons">
  <button type="button" onclick="generate()">Generate SVG</button>
  <button type="button" id="getDefaultsBtn">Get Defaults</button>
  <button type="button" id="downloadBtn" disabled>Download SVG</button>
</div>

<h2>Preview:</h2>
<iframe id="preview" width="720" height="720"></iframe>

<script src="script.js"></script>
</body>
</html>
